async function rTeam(){$("#v").innerHTML=`<div class="card"><label>Team</label><div id="tl"><small>Loading...</small></div><small>Change a person's role here; they see it the next time they open the app. To add a new person, create their login in Supabase (Authentication, Users, Add user), then set their role here.</small></div>`;
 try{const{data,error}=await db.from("profiles").select("id,email,display_name,role,last_seen");if(error)throw error;const ord={owner:3,editor:2,contributor:1},rows=(data||[]).sort((a,b)=>(ord[b.role]||0)-(ord[a.role]||0)||String(a.email).localeCompare(String(b.email)));

  $("#tl").onchange=async e=>{const s=e.target.closest("select.rl");if(!s)return;const{error}=await db.from("profiles").update({role:s.value}).eq("id",s.dataset.id);toast(error?"Could not change role: "+errTxt(error):"Role updated")}}catch(e){$("#tl").textContent="Could not load the team list."}}

try{const d=JSON.parse(localStorage.getItem("draft")||"null");if(d&&d.blocks)P=d}catch(e){}

const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").map(w=>w.length>3&&w.endsWith("s")&&!w.endsWith("ss")?w.slice(0,-1):w).join(" ");

function mkList(root,onPick,rand){

 root.innerHTML=`<input class="q" type="search" placeholder="Search movements (push-up, push ups…)" style="width:100%"><div class="row" style="margin-top:6px"><select class="fc">${opt("All categories",u(1))}</select><select class="fp">${opt("All patterns",u(2))}</select><select class="fs"><option value="">Any status</option><option value="Recent">Recent</option><option value="Ready">Ready to program</option><option value="Neglected">Neglected</option><option value="Never">Never used</option><option value="RR">Recent &amp; Ready</option><option value="NN">Neglected &amp; Never used</option></select></div>${rand?'<button class="rnd" style="margin-top:6px">Random pick (not recent)</button>':""}<div class="res"></div><div class="ab"></div>`;

 $("#fm").innerHTML=S.reps.formats.map(x=>`<option value="${esc(x)}">`).join("");$("#rp").innerHTML=S.reps.reps.map(x=>`<option value="${esc(x)}">`).join("");$("#wt").innerHTML=S.reps.types.map(x=>`<option value="${esc(x)}">`).join("")}
document.addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(!a||!db)return;const {a:k,b,i,v}=a.dataset;
 if(k==="tab"){tab=v;render()}
 else if(k==="day"){P.day=v;rBuild()}
 else if(k==="addb"){P.blocks.push(nb());rBuild()}
 else if(k==="rb"){P.blocks.splice(b,1);rBuild()}
 else if(k==="addi"){P.blocks[b].items.push({mov:"",reps:"",weight:""});rBuild()}
 else if(k==="addl"){P.blocks[b].items.push({mov:"",reps:"",weight:"",lab:""});rBuild()}
 else if(k==="cf"){P.blocks[b].fmt="";rBuild()}
 else if(k==="ri"){P.blocks[b].items.splice(i,1);rBuild()}
 else if(k==="pick"){mkList($("#pkb"),n=>{P.blocks[b].items[i].mov=n;$("#pk").close();rBuild()},true);$("#pk").showModal()}
 else if(k==="cls")$("#pk").close();
 else if(k==="copy")copy();
 else if(k==="log"){if(two("log",a,"Tap again to log"))logIt()}
 else if(k==="clr"){if(two("clr",a,"Tap again to clear")){P.blocks=[];P.warm="";delete P.pendingFrom;rBuild()}}
 else if(k==="addm")addMov();
 else if(k==="tpl"){const r=dayRows(hd);P.blocks=rowsToBlocks(r);P.warm=r[0][7];tab="build";render();toast("Template loaded")}
 else if(k==="dlall"){(async()=>{for(const x of["log","mov","rep","warm","fw"])await dl(x)})()}
 else if(k==="wnew"){W={orig:"",name:"",fmt:"",desc:""};rBuild()}
 else if(k==="wedit"){const w=S.warm.find(x=>x[0]===P.warm);if(w){W={orig:w[0],name:w[0],fmt:w[1],desc:w[2]};rBuild()}}
 else if(k==="wsave")saveWarm()
 else if(k==="wcancel"){W=null;rBuild()}
 else if(k==="mok"||k==="mno")apprMov(a.dataset.pid,a.dataset.n,k==="mok")
 else if(k==="esave")editMov()
 else if(k==="edel"){if(two("edel",a,"Tap again to delete"))delMov()}
 else if(k==="ecan"){ED=null;rEd()}
 else if(k==="fday"){FD=v;rFw()}
 else if(k==="fadd"){S.fw.push([FB,FD,"","",""]);rFw()}
 else if(k==="frd"){S.fw.splice(i,1);rFw()}
 else if(k==="fsave")saveFw()
 else if(k==="fnew"){FN={mode:"new",name:"",copy:true};rFw()}
 else if(k==="fren"){FN={mode:"ren",name:FB,copy:false};rFw()}
 else if(k==="fdel"){if(two("fdel",a,"Tap again to delete block"))delBlock()}
 else if(k==="fok")okBlock()
 else if(k==="fcan"){FN=null;rFw()}
 else if(k==="bk")backupAll()
 else if(k==="dl")dl(v);else if(k==="wok"||k==="wed"||(k==="wno"&&two("wno"+a.dataset.u+a.dataset.d,a,"Tap again to confirm")))pendAct(k,a.dataset.u,a.dataset.d)});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(!f)return;const b=t.dataset.b,i=t.dataset.i;
 if(f==="date"){if(t.value){P.date=t.value;const g=new Date(t.value+"T00:00:00").getDay();if(g>=1&&g<=6)P.day=DAYS[g-1];rBuild()}}else if(f==="warm"){P.warm=t.value;rBuild()}
 else if(f==="block"){P.block=t.value;rBuild()}
 else if(f==="wname"||f==="wfmt"||f==="wdesc"){W[{wname:"name",wfmt:"fmt",wdesc:"desc"}[f]]=t.value}
 else if(f==="en"||f==="ec"||f==="ep"||f==="ee"){ED[{en:"name",ec:"cat",ep:"pat",ee:"eq"}[f]]=t.value}
 else if(f==="fb"){FB=t.value;rFw()}
 else if(f==="fl"||f==="ft"||f==="fe"){S.fw[i][{fl:2,ft:3,fe:4}[f]]=t.value}
 else if(f==="fnn"){FN.name=t.value}else if(f==="fnc"){FN.copy=t.checked}
 else if(f==="hd"){hd=t.value;hSel()}
 else if(f==="hm"){const q=t.value,r=q?S.log.filter(x=>x[4]&&match(x[4],q)).sort((a,c)=>a[0]<c[0]?1:-1).slice(0,40):[];$("#hr").innerHTML=r.map(x=>`<div class="it"><b>${esc(x[0])}</b> ${esc(x[1])}<small>${esc([x[2],x[3],x[5],x[4],x[6]].filter(Boolean).join(" · "))}</small></div>`).join("")||(q?"<small>No matches.</small>":"")}
 else{if(f==="fmtpick"){if(t.value){const o=P.blocks[b];o.fmt=o.fmt?o.fmt+"\n"+t.value:t.value;rBuild()}return}if(f==="type"||f==="fmt"||f==="mins")P.blocks[b][f]=t.value;else P.blocks[b].items[i][f]=t.value;pv();save()}});
const showLogin=(msg)=>{$("#acct").innerHTML="";$("#nav").innerHTML="";$("#tm").hidden=true;$("#v").innerHTML=`<form id="lf" class="card"><label>Sign in</label><input id="le" type="email" autocomplete="username" placeholder="Email" style="width:100%" required><input id="lp" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin-top:6px" required><button class="pri" style="margin-top:8px;width:100%">Sign in</button><small id="lm" style="margin-top:6px;color:var(--r)">${esc(msg||"")}</small><small>Accounts are created by the owner. Ask them if you do not have one.</small></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const{data,error}=await db.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});b.disabled=false;if(error){$("#lm").textContent="Could not sign in. Check your email and password.";return}boot(data.session)}};
async function boot(session){
 $("#v").innerHTML="<p>Loading...</p>";
 try{const{data,error}=await db.from("profiles").select("role,email").eq("id",session.user.id).maybeSingle();if(error)throw error;
  if(!data){$("#v").innerHTML='<div class="card"><p>Your login works but has no access yet. Ask the owner.</p><button id="so0">Sign out</button></div>';$("#so0").onclick=async()=>{await db.auth.signOut();location.reload()};return}
  R.t={owner:3,editor:2,contributor:1}[data.role]||1;R.id=session.user.id;R.email=data.email||session.user.email;
  $("#acct").innerHTML=`<small style="text-align:right">${esc(R.email)} <span class="bd" style="background:var(--ac)">${["","Contributor","Editor","Owner"][R.t]}</span></small><div class="row" style="justify-content:flex-end;gap:4px"><button id="pw" style="min-height:30px;padding:2px 8px;font-size:12px">Password</button><button id="so" style="min-height:30px;padding:2px 8px;font-size:12px">Sign out</button></div>`;
  $("#so").onclick=async()=>{await db.auth.signOut();location.reload()};
  $("#pw").onclick=()=>{$("#np1").value="";$("#np2").value="";$("#acm").textContent="";$("#ac").showModal()};
  $("#acx").onclick=()=>$("#ac").close();
  $("#acs").onclick=async()=>{const a=$("#np1").value;if(a.length<8)return $("#acm").textContent="Use at least 8 characters.";if(a!==$("#np2").value)return $("#acm").textContent="The two passwords do not match.";const{error}=await db.auth.updateUser({password:a});if(error)return $("#acm").textContent="Could not change password: "+errTxt(error);$("#ac").close();toast("Password changed")};
  db.rpc("touch_seen").then(()=>{},()=>{});
  await Promise.all([loadLive(),loadWarm(),loadReps(),loadFw()]);
 }catch(e){$("#v").innerHTML='<div class="card"><p>Could not load the data: '+esc(errTxt(e))+'</p><button id="rt">Try again</button></div>';$("#rt").onclick=()=>boot(session);return}
 render();
 const idle=()=>document.visibilityState==="visible"&&!document.querySelector("input:focus,textarea:focus,select:focus")&&!document.querySelector("dialog[open]");
 const live=async()=>{if(!idle()||tab==="fw")return;try{await loadLive();render()}catch(e){}};
 setInterval(live,45000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")live()})}
(async()=>{
 if(!window.supabase){$("#v").innerHTML='<div class="card"><p>Could not load the sign-in service. Check your connection and reload.</p></div>';return}
 db=window.supabase.createClient(SB_URL,SB_KEY);
 db.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")showLogin()});
 const{data:{session}}=await db.auth.getSession();
 if(session)boot(session);else showLogin()
})();
</script></body></html>
